name: on-tag-release-npm

on:
  push:
      tags:
          - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-into-npm:
    name: Build the project and publish the new version into NPM registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup node version
        uses: actions/setup-node@v7
        with:
            node-version: '26'
            registry-url: 'https://registry.npmjs.org'
            package-manager-cache: false
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install project dependencies
        run: npm install
      - name: Build the project
        run: npm run build
        env:
          CI: true
      - name: Publish the new version into NPM registry
        run: npm publish
