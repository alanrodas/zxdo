name: on-commit-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Run the tests and ensure all test pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup node version
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install project dependencies
        run: npm install
      - name: Run linter and validate style
        run: npm run lint
      - name: Run tests
        run: npm run test
        env:
          CI: true
